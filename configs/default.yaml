# NAC: Default Experiment Configuration

# Model
model:
  arch: "ViT-B/32"           # CLIP architecture
  pretrained: "openai"        # Pretrained weights

# Data
data:
  root: "./data"              # Dataset root directory
  prompt_template: "a photo of a {}."  # Zero-shot prompt template
  datasets:                   # Default evaluation datasets
    - cifar10
    - cifar100
    - STL10

# Attack (PGD)
attack:
  epsilon: 4                  # Perturbation budget (in /255)
  steps: 5                    # PGD iterations
  step_size: 1                # Step size (in /255)
  norm: "l_inf"               # Norm constraint

# Defense (Counterattack)
defense:
  method: "nac"               # "ttc" or "nac"
  epsilon: 4                  # Counterattack budget (in /255)
  steps: 2                    # Counterattack iterations
  step_size: 1                # Step size (in /255)
  norm: "l_inf"               # Norm constraint
  tau_threshold: 0.2          # Tau threshold for step weighting
  beta: 2.0                   # Weighting coefficient

# NAC specific
nac:
  momentum: 0.9               # Nesterov momentum coefficient

# Experiment
experiment:
  seed: 0                     # Random seed
  output_dir: "./results"     # Output directory
